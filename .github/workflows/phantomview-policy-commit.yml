name: PhantomView committed policy integration
on:
  pull_request:
    branches: [main]
    paths: ['phantomview/**', '.github/workflows/phantomview-policy-commit.yml']
  workflow_dispatch:
    inputs:
      policy_revision:
        description: Reviewed immutable phantomyard-tools commit with committed-policy support
        required: true
        type: string
permissions:
  contents: read
jobs:
  privileged-integration:
    runs-on: ubuntu-latest
    env:
      POLICY_REVISION: ${{ inputs.policy_revision || '3436037c65cb9ef427f716605264688f23ed9719' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require an immutable dependency revision
        run: python -c "import os,re; assert re.fullmatch('[0-9a-f]{40}', os.environ['POLICY_REVISION'])"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: salvaalba-dev/phantomyard-tools
          ref: ${{ env.POLICY_REVISION }}
          path: policy-source
          persist-credentials: false
      - name: Install matching disposable test runtime
        run: |
          python -m venv "$RUNNER_TEMP/policy-reader-env"
          "$RUNNER_TEMP/policy-reader-env/bin/python" -m pip install -r phantomview/requirements.txt './policy-source/phantomdocs[dev]' './policy-source/phantomorg'
          "$RUNNER_TEMP/policy-reader-env/bin/python" -c 'from phantomdocs.workflow_policy_commit import committed_guard'
      - name: Exercise actual source publication and reader revocation as root
        run: |
          sudo env PHANTOMVIEW_POLICY_LINUX=1 PYTHONDONTWRITEBYTECODE=1 "PYTHONPATH=$GITHUB_WORKSPACE/phantomview:$GITHUB_WORKSPACE/policy-source/phantomdocs/src" "$RUNNER_TEMP/policy-reader-env/bin/python" -m unittest discover -s phantomview -p test_policy_delivery_linux.py -v
      - name: Verify exact mixed and dynamic reader composition
        run: |
          env "PHANTOMVIEW_COMMIT_REFERENCE=$GITHUB_WORKSPACE/phantomview" "$RUNNER_TEMP/policy-reader-env/bin/python" -m pytest policy-source/phantomdocs/tests/test_policy_reader_composition.py -q
