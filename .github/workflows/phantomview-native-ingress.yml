name: PhantomView native ingress provenance

on:
  push:
    paths:
      - 'phantomview/native_ingress*'
      - 'phantomview/test_native_ingress_patch.py'
      - 'phantomview/native_channel*'
      - 'phantomview/test_native_channel_patch.py'
      - 'phantomview/native_host_review.py'
      - 'phantomview/native-host-review.json'
      - 'phantomview/test_native_host_review.py'
      - '.github/workflows/phantomview-native-ingress.yml'
  pull_request:
    paths:
      - 'phantomview/native_ingress*'
      - 'phantomview/test_native_ingress_patch.py'
      - 'phantomview/native_channel*'
      - 'phantomview/test_native_channel_patch.py'
      - 'phantomview/native_host_review.py'
      - 'phantomview/native-host-review.json'
      - 'phantomview/test_native_host_review.py'
      - '.github/workflows/phantomview-native-ingress.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phantomyard/phantombot
          ref: 5af27060327ee8c53fe730dd8b98b6b305c62add
          path: native-source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Verify patch refusal and preparation in temporary copies
        working-directory: phantomview
        env:
          PHANTOMVIEW_NATIVE_SOURCE: ${{ github.workspace }}/native-source
        run: python3 -m unittest test_native_ingress_patch test_native_channel_patch test_native_host_review -v
      - name: Prepare the provenance variant in the disposable checkout
        run: |
          python3 phantomview/native_channel_patch.py native-source
          cp phantomview/native_ingress_runtime.test.ts native-source/tests/phantomview-ingress.test.ts
          cp phantomview/native_channel_runtime.test.ts native-source/tests/phantomview-native-channel.test.ts
      - name: Install locked native dependencies
        working-directory: native-source
        run: bun install --frozen-lockfile
      - name: Verify real parsing, gift-wrap crypto and existing channel behavior
        working-directory: native-source
        run: bun test tests/phantomview-ingress.test.ts tests/phantomview-native-channel.test.ts tests/channels-telegram.test.ts tests/channels-phantomchat-channel.test.ts tests/channels-phantomchat-server.test.ts
      - name: Compile the provenance variant baseline executable
        working-directory: native-source
        run: bun run build:x64
