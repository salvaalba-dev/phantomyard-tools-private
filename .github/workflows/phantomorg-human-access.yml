name: PhantomOrg human access

on:
  push:
    paths:
      - 'phantomview/phantomorg-human-access.*'
      - 'phantomview/phantomorg-category-limits.*'
      - 'phantomview/phantomorg_category_limits_patch.py'
      - 'phantomview/test_phantomorg_category_limits_patch.py'
      - 'phantomview/test_phantomorg_access.py'
      - '.github/workflows/phantomorg-human-access.yml'
  pull_request:
    paths:
      - 'phantomview/phantomorg-human-access.*'
      - 'phantomview/phantomorg-category-limits.*'
      - 'phantomview/phantomorg_category_limits_patch.py'
      - 'phantomview/test_phantomorg_category_limits_patch.py'
      - 'phantomview/test_phantomorg_access.py'
      - '.github/workflows/phantomorg-human-access.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout the reviewed fork baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: salvaalba-dev/phantomyard-tools
          ref: e2c9ac19f71cbf8a97c023c171a201ce5e58e877
          path: compatibility-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Apply the private counterpart patch
        working-directory: compatibility-source
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('../phantomview/phantomorg-human-access.manifest.json').read_text())
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if revision != manifest['base']:
              raise SystemExit('PhantomOrg patch requires its exact reviewed base revision')
          for name, hashes in manifest['files'].items():
              if hashes['base_sha256_lf'] is None:
                  if pathlib.Path(name).exists():
                      raise SystemExit('PhantomOrg patch requires a new path: ' + name)
                  continue
              normalized = pathlib.Path(name).read_text(encoding='utf-8').replace('\r\n', '\n').encode('utf-8')
              if hashlib.sha256(normalized).hexdigest() != hashes['base_sha256_lf']:
                  raise SystemExit('PhantomOrg patch base hash mismatch: ' + name)
          PY
          git apply --check ../phantomview/phantomorg-human-access.patch
          git apply ../phantomview/phantomorg-human-access.patch
          python - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path('../phantomview/phantomorg-human-access.manifest.json').read_text())
          for name, hashes in manifest['files'].items():
              normalized = pathlib.Path(name).read_text(encoding='utf-8').replace('\r\n', '\n').encode('utf-8')
              if hashlib.sha256(normalized).hexdigest() != hashes['result_sha256_lf']:
                  raise SystemExit('PhantomOrg patch result hash mismatch: ' + name)
          PY
      - name: Install PhantomOrg test dependencies
        run: python -m pip install -e './compatibility-source/phantomorg[dev]'
      - name: Run the full PhantomOrg suite on Linux
        working-directory: compatibility-source/phantomorg
        run: python -m pytest tests -q
      - name: Check the PhantomView policy integration
        working-directory: phantomview
        run: python -m unittest test_phantomorg_access -v
      - name: Compile the patched package
        run: python -m compileall -q compatibility-source/phantomorg/phantomorg
      - name: Prepare exact category-limit overlay and reject reapplication
        run: |
          python phantomview/phantomorg_category_limits_patch.py compatibility-source
          python - <<'PY'
          import sys
          sys.path.insert(0, 'phantomview')
          from phantomorg_category_limits_patch import patch
          try:
              patch('compatibility-source')
          except ValueError:
              pass
          else:
              raise SystemExit('Overlay reapplication was not rejected')
          PY
      - name: Full PhantomOrg regression with category limits
        working-directory: compatibility-source/phantomorg
        run: python -m pytest tests -q
      - name: Verify extended compiler and viewer agreement
        working-directory: phantomview
        run: |
          python -m unittest test_phantomorg_access test_human_category_limits test_phantomorg_category_limits_patch -v
          python -m compileall -q . ../compatibility-source/phantomorg/phantomorg
