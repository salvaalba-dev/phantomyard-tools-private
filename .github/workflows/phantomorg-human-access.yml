name: PhantomOrg human access

on:
  push:
    paths:
      - 'phantomview/phantomorg-human-access.*'
      - 'phantomview/test_phantomorg_access.py'
      - '.github/workflows/phantomorg-human-access.yml'
  pull_request:
    paths:
      - 'phantomview/phantomorg-human-access.*'
      - 'phantomview/test_phantomorg_access.py'
      - '.github/workflows/phantomorg-human-access.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout the reviewed fork baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: salvaalba-dev/phantomyard-tools
          ref: e2c9ac19f71cbf8a97c023c171a201ce5e58e877
          path: compatibility-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Apply the private counterpart patch
        working-directory: compatibility-source
        run: |
          git apply --check ../phantomview/phantomorg-human-access.patch
          git apply ../phantomview/phantomorg-human-access.patch
      - name: Install PhantomOrg test dependencies
        run: python -m pip install -e './compatibility-source/phantomorg[dev]'
      - name: Run the full PhantomOrg suite on Linux
        working-directory: compatibility-source/phantomorg
        run: python -m pytest tests -q
      - name: Check the PhantomView policy integration
        working-directory: phantomview
        run: python -m unittest test_phantomorg_access -v
      - name: Compile the patched package
        run: python -m compileall -q compatibility-source/phantomorg/phantomorg
