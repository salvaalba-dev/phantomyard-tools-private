name: PhantomView relay AUTH regression
on:
  pull_request:
    paths:
      - 'phantomview/relay_auth*'
      - 'phantomview/test_relay_auth_patch.py'
      - '.github/workflows/phantomview-relay-auth.yml'
  push:
    paths:
      - 'phantomview/relay_auth*'
      - 'phantomview/test_relay_auth_patch.py'
      - '.github/workflows/phantomview-relay-auth.yml'
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - name: Check overlay refusal and provenance tests
        working-directory: phantomview
        run: python -m unittest test_relay_auth_patch -v
      - name: Install the exact public dependency in an isolated fixture
        run: |
          mkdir relay-fixture
          printf '%s\n' '{"private":true,"type":"module","dependencies":{"nostr-tools":"2.23.3"}}' > relay-fixture/package.json
          cd relay-fixture
          bun install --ignore-scripts
      - name: Check out the real guard at the native build revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phantomyard/phantombot
          ref: 5af27060327ee8c53fe730dd8b98b6b305c62add
          path: guard-source
          persist-credentials: false
          sparse-checkout: |
            src/channels/phantomchat
            src/lib/logger.ts
          sparse-checkout-cone-mode: false
      - name: Demonstrate the original regression, then verify the repair
        env:
          PHANTOMVIEW_NATIVE_SOURCE: ${{ github.workspace }}/relay-fixture
        run: |
          if node --test --test-timeout=1500 phantomview/relay_auth_regression.mjs > unpatched-auth.log 2>&1; then
            cat unpatched-auth.log
            echo 'Expected the unpatched dependency to fail the disconnect regression.'
            exit 1
          fi
          grep -q SendingOnClosedConnection unpatched-auth.log
          python phantomview/relay_auth_patch.py relay-fixture --manifest relay-auth-patch.json
          node --test --test-timeout=5000 phantomview/relay_auth_regression.mjs
          bun test ./phantomview/relay_auth_regression.mjs --timeout 5000
          python phantomview/relay_auth_patch.py relay-fixture --manifest relay-auth-patch.json --verify
      - name: Exercise the real pool, AUTH guard and signer with a synthetic websocket
        env:
          PHANTOMVIEW_NATIVE_SOURCE: ${{ github.workspace }}/guard-source
        run: |
          ln -s "$GITHUB_WORKSPACE/relay-fixture/node_modules" guard-source/node_modules
          bun test ./phantomview/relay_auth_guard_integration.test.mjs --timeout 5000
      - name: Preserve non-secret test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantomview-relay-auth-regression
          path: |
            unpatched-auth.log
            relay-auth-patch.json
          retention-days: 14
