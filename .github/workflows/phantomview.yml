name: PhantomView
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r phantomview/requirements.txt
      - name: Check out the reviewed native category reader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: salvaalba-dev/phantomyard-tools
          ref: 88236994bf42f88fe8355d13953cdcff0ba17b4c
          path: native-acl-source
          persist-credentials: false
      - name: Verify generated category ACL compatibility
        run: python phantomview/sync_category_acl.py native-acl-source/phantomdocs/src/phantomdocs/access.py --check
      - name: Test native source parity
        env:
          PHANTOMVIEW_NATIVE_ACL_SOURCE: native-acl-source/phantomdocs/src/phantomdocs/access.py
        run: python -m unittest discover -s phantomview -p test_category_acl.py
      - name: Full suite with umask 022
        if: runner.os == 'Linux'
        shell: bash
        run: (umask 022; python3 -m unittest discover -s phantomview -p 'test_*.py')
      - name: Full suite with umask 002
        if: runner.os == 'Linux'
        shell: bash
        run: (umask 002; python3 -m unittest discover -s phantomview -p 'test_*.py')
      - name: Full suite on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s phantomview -p "test_*.py"
      - run: python -m compileall -q phantomview
