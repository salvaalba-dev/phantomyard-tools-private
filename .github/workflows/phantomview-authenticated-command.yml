name: PhantomView authenticated command seam

on:
  push:
    paths:
      - 'phantomview/authenticated_command*'
      - 'phantomview/native_link*'
      - 'phantomview/native_listener_runtime.ts'
      - 'phantomview/native_startup_binding*'
      - 'phantomview/native_host_entry.py'
      - 'phantomview/native-host-example.json'
      - 'phantomview/test_native_host_entry.py'
      - 'phantomview/runtime_default.py'
      - 'phantomview/test_runtime_default.py'
      - 'phantomview/private_control*'
      - 'phantomview/test_private_control*'
      - 'phantomview/test_authenticated_command*'
      - 'phantomview/native_ingress_patch.py'
      - 'phantomview/native_channel_patch.py'
      - '.github/workflows/phantomview-authenticated-command.yml'
  pull_request:
    paths:
      - 'phantomview/authenticated_command*'
      - 'phantomview/native_link*'
      - 'phantomview/native_listener_runtime.ts'
      - 'phantomview/native_startup_binding*'
      - 'phantomview/native_host_entry.py'
      - 'phantomview/native-host-example.json'
      - 'phantomview/test_native_host_entry.py'
      - 'phantomview/runtime_default.py'
      - 'phantomview/test_runtime_default.py'
      - 'phantomview/private_control*'
      - 'phantomview/test_private_control*'
      - 'phantomview/test_authenticated_command*'
      - 'phantomview/native_ingress_patch.py'
      - 'phantomview/native_channel_patch.py'
      - '.github/workflows/phantomview-authenticated-command.yml'

permissions:
  contents: read

jobs:
  command-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phantomyard/phantombot
          ref: 5af27060327ee8c53fe730dd8b98b6b305c62add
          path: native-source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: salvaalba-dev/phantomyard-tools
          ref: 4147924afad85b1db6752b709c29b78d6f56774c
          path: signing-source
          persist-credentials: false
      - name: Install the pinned real signed-link verifier in a disposable environment
        run: |
          python3 -m venv signer-venv
          signer-venv/bin/python -m pip install -r phantomview/requirements.txt './signing-source/phantomblog[access]'
      - name: Check exact-source preparation and refusal in temporary copies
        working-directory: phantomview
        env:
          PHANTOMVIEW_NATIVE_SOURCE: ${{ github.workspace }}/native-source
        run: python3 -m unittest test_authenticated_command_patch test_native_host_entry -v
      - name: Prepare fixed synthetic host routes in the reviewed CLI
        run: |
          python3 phantomview/native_host_entry.py native-source phantomview/native-host-example.json
          cp phantomview/authenticated_command_runtime.test.ts native-source/tests/phantomview-authenticated-command.test.ts
          cp phantomview/authenticated_command_startup.test.ts native-source/tests/phantomview-command-startup.test.ts
          cp phantomview/private_control_runtime.test.ts native-source/tests/phantomview-private-control.test.ts
          cp phantomview/native_link_callback.test.ts native-source/tests/phantomview-native-link.test.ts
          cp phantomview/native_link_signer.test.ts native-source/tests/phantomview-native-signer.test.ts
          cp phantomview/native_startup_binding.test.ts native-source/tests/phantomview-runtime-binding.test.ts
          cp phantomview/native_ingress_runtime.test.ts native-source/tests/phantomview-ingress.test.ts
      - name: Install locked native dependencies
        working-directory: native-source
        run: bun install --frozen-lockfile
      - name: Verify actual native dispatch, gift-wrap authentication and unchanged channel behavior
        working-directory: native-source
        run: bun test tests/phantomview-authenticated-command.test.ts tests/phantomview-native-link.test.ts tests/phantomview-ingress.test.ts tests/channels-telegram.test.ts tests/channels-phantomchat-channel.test.ts tests/channels-phantomchat-server.test.ts
      - name: Verify daemon startup registration and existing startup regressions
        working-directory: native-source
        run: bun test tests/phantomview-command-startup.test.ts tests/phantomview-runtime-binding.test.ts tests/cli-run.test.ts
      - name: Compile the reviewed source proposal
        working-directory: native-source
        run: bun run build:x64
      - name: Verify private control delivery with mocked IO
        working-directory: native-source
        run: bun test tests/phantomview-private-control.test.ts
      - name: Verify native signing against the real identified Python reader
        working-directory: native-source
        env:
          PHANTOMVIEW_SIGNER_PYTHON: ${{ github.workspace }}/signer-venv/bin/python
        run: bun test tests/phantomview-native-signer.test.ts
