# Manual, AU-independent build only. Inputs contain non-secret deployment coordinates.
name: PhantomView operator native build

on:
  workflow_dispatch:
    inputs:
      native_host_json:
        description: Reviewed non-secret routes JSON (no credentials or human identifiers)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NATIVE_SOURCE_REVISION: 5af27060327ee8c53fe730dd8b98b6b305c62add
      NATIVE_RELEASE_TAG: v1.1.433
      BUILD_BUN_VERSION: '1.3.11'
      BUILD_PYTHON_VERSION: '3.12.15'
    steps:
      - name: Reject unsupported repository or ref explicitly
        run: |
          if [ "$GITHUB_REPOSITORY" != "salvaalba-dev/phantomyard-tools-private" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Build refused: dispatch this workflow from main in salvaalba-dev/phantomyard-tools-private."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}
      - name: Validate and store the normalized operator input
        env:
          NATIVE_HOST_JSON: ${{ inputs.native_host_json }}
        run: python phantomview/native_build.py routes
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: phantomyard/phantombot
          ref: ${{ env.NATIVE_SOURCE_REVISION }}
          path: native-source
          persist-credentials: false
      - name: Bind the upstream release tag to the exact reviewed commit
        run: |
          git -C native-source fetch --no-tags origin "refs/tags/$NATIVE_RELEASE_TAG:refs/tags/phantomview-reviewed-native"
          python phantomview/native_build.py source
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUILD_BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Install hash-locked binary wheels and the archived reviewed verifier
        run: |
          python -m venv signer-venv
          signer-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r phantomview/native-build-requirements.lock
          SITE_DIRECTORY="$(signer-venv/bin/python -c 'import site; print(site.getsitepackages()[0])')"
          python phantomview/native_build.py verifier --site-directory "$SITE_DIRECTORY"
          signer-venv/bin/python -m pip check
      - name: Verify exact-source preparation and refusal tests
        id: preparation
        working-directory: phantomview
        env:
          PHANTOMVIEW_NATIVE_SOURCE: ${{ github.workspace }}/native-source
        run: ../signer-venv/bin/python -m unittest test_authenticated_command_patch test_native_host_entry test_native_build test_relay_auth_patch -v
      - name: Prepare reviewed operator routes without changing upstream
        run: |
          python phantomview/native_host_entry.py native-source operator-build/routes.json
          cp phantomview/authenticated_command_runtime.test.ts native-source/tests/phantomview-authenticated-command.test.ts
          cp phantomview/authenticated_command_startup.test.ts native-source/tests/phantomview-command-startup.test.ts
          cp phantomview/private_control_runtime.test.ts native-source/tests/phantomview-private-control.test.ts
          cp phantomview/native_link_callback.test.ts native-source/tests/phantomview-native-link.test.ts
          cp phantomview/native_link_signer.test.ts native-source/tests/phantomview-native-signer.test.ts
          cp phantomview/native_startup_binding.test.ts native-source/tests/phantomview-runtime-binding.test.ts
          cp phantomview/native_ingress_runtime.test.ts native-source/tests/phantomview-ingress.test.ts
          cp phantomview/persona_conversation_runtime.test.ts native-source/tests/phantomview-persona-conversation.test.ts
      - name: Install unchanged locked native dependencies
        working-directory: native-source
        run: bun install --frozen-lockfile
      - name: Apply the exact-byte reviewed relay AUTH overlay
        run: python phantomview/relay_auth_patch.py native-source --manifest operator-build/relay-auth-patch.json
      - name: Verify native dispatch, authenticated channels and startup
        id: channels
        working-directory: native-source
        run: |
          PHANTOMVIEW_NATIVE_SOURCE="$PWD" node --test --test-timeout=5000 ../phantomview/relay_auth_regression.mjs
          PHANTOMVIEW_NATIVE_SOURCE="$PWD" bun test ../phantomview/relay_auth_regression.mjs --timeout 5000
          PHANTOMVIEW_NATIVE_SOURCE="$PWD" bun test ../phantomview/relay_auth_guard_integration.test.mjs --timeout 5000
          bun test tests/phantomview-authenticated-command.test.ts tests/phantomview-native-link.test.ts tests/phantomview-ingress.test.ts tests/channels-telegram.test.ts tests/channels-phantomchat-channel.test.ts tests/channels-phantomchat-server.test.ts
          bun test tests/phantomview-command-startup.test.ts tests/phantomview-runtime-binding.test.ts tests/cli-run.test.ts
      - name: Verify existing-persona transport, private controls and real signing
        id: persona
        working-directory: native-source
        env:
          PHANTOMVIEW_SIGNER_PYTHON: ${{ github.workspace }}/signer-venv/bin/python
          PHANTOMVIEW_SOURCE: ${{ github.workspace }}/phantomview
        run: |
          bun test tests/phantomview-persona-conversation.test.ts tests/cli-ask.test.ts
          bun test tests/phantomview-private-control.test.ts tests/phantomview-native-signer.test.ts
      - name: Stamp the tag-verified private version and original embedded editor assets
        run: |
          python phantomview/native_build.py stamp
          export PHANTOMBOT_EXT_VERSION="$(python -c 'import json; print(json.load(open("operator-build/source.json"))["release_version"])')"
          cd native-source
          bun run gen:vscode-vsix
          cd ..
          python phantomview/native_build.py embedded
      - name: Compile Linux x64 baseline binary
        working-directory: native-source
        run: |
          python ../phantomview/relay_auth_patch.py . --manifest ../operator-build/relay-auth-patch.json --verify
          bun run build:x64
      - name: Record verified source, tests, toolchain, runner and ELF provenance
        env:
          TEST_PREPARATION: ${{ steps.preparation.outcome }}
          TEST_CHANNELS: ${{ steps.channels.outcome }}
          TEST_PERSONA: ${{ steps.persona.outcome }}
        run: |
          mkdir -m 700 operator-build/artifact
          install -m 755 native-source/dist/phantombot operator-build/artifact/phantombot
          signer-venv/bin/python phantomview/native_build.py receipt
          EXPECTED_SHA="$(signer-venv/bin/python -c 'import json; print(json.load(open("operator-build/artifact/build-receipt.json"))["binary_sha256"])')"
          python phantomview/native_build.py check-host --binary operator-build/artifact/phantombot --expected-sha256 "$EXPECTED_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantomview-native-${{ github.run_id }}
          path: operator-build/artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Retain the non-secret provenance separately from the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phantomview-native-receipt-${{ github.run_id }}
          path: operator-build/artifact/build-receipt.json
          if-no-files-found: error
          retention-days: 90
