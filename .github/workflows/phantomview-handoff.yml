name: PhantomView isolated handoff

on:
  push:
    paths:
      - 'phantomview/handoff_client.py'
      - 'phantomview/reader_handoff.py'
      - 'phantomview/phantomview.py'
      - 'phantomview/test_reader_handoff.py'
      - 'phantomview/trusted_handoff.py'
      - 'phantomview/identified_access.py'
      - 'phantomview/channel_identity.py'
      - 'phantomview/assistant_scope.py'
      - 'phantomview/view_permissions.py'
      - 'phantomview/test_handoff*.py'
      - '.github/workflows/phantomview-handoff.yml'
  pull_request:
    paths:
      - 'phantomview/handoff_client.py'
      - 'phantomview/reader_handoff.py'
      - 'phantomview/phantomview.py'
      - 'phantomview/test_reader_handoff.py'
      - 'phantomview/trusted_handoff.py'
      - 'phantomview/identified_access.py'
      - 'phantomview/channel_identity.py'
      - 'phantomview/assistant_scope.py'
      - 'phantomview/view_permissions.py'
      - 'phantomview/test_handoff*.py'
      - '.github/workflows/phantomview-handoff.yml'

permissions:
  contents: read

jobs:
  isolated-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout the private implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout the reviewed signing implementation from the fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: salvaalba-dev/phantomyard-tools
          ref: 8244ce3617ff35e290cf5b228cd568752bc348d1
          path: handoff-signing-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install the reviewed access implementation and test dependencies
        run: python -m pip install -r phantomview/requirements.txt './handoff-signing-source/phantomblog[access]'
      - name: Run the complete suite with real signature integration
        working-directory: phantomview
        run: python -m unittest discover -p 'test_*.py' -q
      - name: Verify separate kernel accounts on this disposable runner
        working-directory: phantomview
        env:
          PHANTOMVIEW_ACCOUNT_TESTS: '1'
        run: sudo -n --preserve-env=PHANTOMVIEW_ACCOUNT_TESTS -- "$(command -v python)" test_handoff_accounts.py -v
